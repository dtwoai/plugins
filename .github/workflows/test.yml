name: Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: read-all

jobs:
  skill-harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill-harness

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.27.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: skill-harness/pnpm-lock.yaml

      # The Codex package test skips itself without zip/unzip; fail instead so CI always runs the build.
      - name: Require zip and unzip
        run: command -v zip && command -v unzip

      - run: pnpm install --frozen-lockfile

      # Manifest version parity, the Codex/Cursor skill lists, the OpenAI package build, and the schema digest.
      - run: pnpm test

      - run: pnpm biome:check
